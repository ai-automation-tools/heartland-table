# Dependency updates for the PDF build tooling under print/ (the cookbook itself is static
# HTML with no dependencies). Minor/patch bumps arrive as one grouped PR per folder per
# week; major versions are ignored (the org convention since 2026-09-29). Dependabot
# security alerts still fire for any version. The org PR sweep (Wed + Sun 09:30) merges
# grouped minor/patch and security-fix PRs and holds majors for Mike. Added 2026-10-14:
# 30 open alerts (2 critical, 22 high) in these two lockfiles had nothing acting on them.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/print"
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/print/build-script-codex"
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
